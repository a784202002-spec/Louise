<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f5d50">
  <title>請假登記表</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-row">
      <h1>請假登記表</h1>
      <div id="user-box" class="user-box" hidden>
        <span id="user-label" class="user-label"></span>
        <button id="logout-button" type="button" class="secondary small">登出</button>
      </div>
    </div>
    <p id="header-hint">請先登入。帳號由部門管理者建立。</p>
  </header>

  <main>
    <!-- 登入 -->
    <section id="login-section" class="card" aria-labelledby="login-title">
      <h2 id="login-title">登入</h2>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" autocomplete="username"
                 inputmode="email" required placeholder="name@example.com">
        </div>
        <div class="field">
          <label for="login-password">密碼</label>
          <input id="login-password" name="password" type="password"
                 autocomplete="current-password" required>
        </div>
        <button id="login-button" type="submit" class="wide">登入</button>
        <p id="login-message" class="message" role="status" aria-live="polite" hidden></p>
      </form>
    </section>

    <!-- 登入後 -->
    <div id="app-section" hidden>
      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">新增請假</h2>
        <form id="leave-form" novalidate>
          <div class="field">
            <label for="applicant_name">請假人姓名</label>
            <input id="applicant_name" name="applicant_name" type="text" maxlength="50"
                   autocomplete="name" required placeholder="例如：陳虛構">
          </div>

          <fieldset class="field">
            <legend>假別</legend>
            <div class="choices four">
              <label class="choice"><input type="radio" name="leave_type" value="特休" required><span>特休</span></label>
              <label class="choice"><input type="radio" name="leave_type" value="事假"><span>事假</span></label>
              <label class="choice"><input type="radio" name="leave_type" value="病假"><span>病假</span></label>
              <label class="choice"><input type="radio" name="leave_type" value="補休"><span>補休</span></label>
              <label class="choice"><input type="radio" name="leave_type" value="公假"><span>公假</span></label>
              <label class="choice"><input type="radio" name="leave_type" value="婚假"><span>婚假</span></label>
              <label class="choice"><input type="radio" name="leave_type" value="喪假"><span>喪假</span></label>
              <label class="choice"><input type="radio" name="leave_type" value="其他"><span>其他</span></label>
            </div>
          </fieldset>

          <div class="two-col">
            <div class="field">
              <label for="start_at">開始日期與時間</label>
              <input id="start_at" name="start_at" type="datetime-local" required>
            </div>
            <div class="field">
              <label for="end_at">結束日期與時間</label>
              <input id="end_at" name="end_at" type="datetime-local" required>
            </div>
          </div>

          <div class="two-col">
            <div class="field">
              <label for="hours">請假時數</label>
              <input id="hours" name="hours" type="number" inputmode="decimal"
                     min="0.5" max="240" step="0.5" required placeholder="例如：8">
              <small class="hint">以 0.5 小時為單位，最多 240 小時</small>
            </div>
            <div class="field">
              <label for="deputy_name">職務代理人 <span class="optional">（選填）</span></label>
              <input id="deputy_name" name="deputy_name" type="text" maxlength="50"
                     placeholder="例如：林範例">
            </div>
          </div>

          <div class="field">
            <label for="reason">事由</label>
            <textarea id="reason" name="reason" rows="3" maxlength="200" required
                      placeholder="請簡短填寫，例如：家中私事"></textarea>
            <small class="hint"><span id="reason-count">0</span> / 200 字。只有你和主管看得到。</small>
          </div>

          <button id="submit-button" type="submit" class="wide">送出請假</button>
          <p id="form-message" class="message" role="status" aria-live="polite" hidden></p>
        </form>
      </section>

      <section class="card" aria-labelledby="list-title">
        <div class="list-header">
          <h2 id="list-title">最近 20 筆請假</h2>
          <button id="refresh-button" type="button" class="secondary small">重新整理</button>
        </div>
        <p id="list-scope" class="hint"></p>
        <p id="list-message" class="message" role="status" aria-live="polite" hidden></p>
        <ul id="leave-list" class="leave-list"></ul>
      </section>
    </div>
  </main>

  <footer class="site-footer">示範系統，資料皆為虛構，請勿填寫真實個人資料。</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
