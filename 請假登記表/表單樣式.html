<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>請假登記表（表單樣式）</title>
<!--
  請假登記表：表單樣式
  ・單一檔案，不連任何網址或資料庫，直接用瀏覽器打開即可填寫。
  ・送出後只在畫面上顯示填寫內容，不會儲存；重新整理就會清空。
  ・姓名皆為虛構。
-->
<style>
  :root {
    --bg: #f3f6f5;
    --card: #ffffff;
    --text: #1c2724;
    --muted: #5a6964;
    --border: #d2dcd8;
    --primary: #2f5d50;
    --primary-hover: #234a3f;
    --ok-bg: #e6f4ea;
    --ok-text: #1e6b34;
    --err-bg: #fdecea;
    --err-text: #a12622;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121816;
      --card: #1a2320;
      --text: #e4ece9;
      --muted: #98a8a2;
      --border: #2e3b37;
      --primary: #5fae95;
      --primary-hover: #7cc2ab;
      --ok-bg: #173323;
      --ok-text: #8fd9a8;
      --err-bg: #3a1c1b;
      --err-text: #f2a19c;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  main, .site-header { max-width: 720px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
  .site-header { padding-top: 24px; padding-bottom: 8px; }
  .site-header h1 { margin: 0; font-size: 1.6rem; }
  .site-header p { margin: 4px 0 0; color: var(--muted); }
  main { padding-bottom: 24px; }
  .site-footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 0 16px 32px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 16px;
    margin-top: 16px;
  }
  .card h2 { margin: 0 0 12px; font-size: 1.2rem; }

  .field { margin: 0 0 16px; padding: 0; border: 0; min-width: 0; }
  .field > label, .field > legend { display: block; font-weight: 600; margin-bottom: 6px; padding: 0; }
  .optional { font-weight: 400; color: var(--muted); font-size: 0.9rem; }
  .hint { display: block; color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

  .two-col { display: grid; grid-template-columns: 1fr; gap: 0 12px; }
  @media (min-width: 560px) { .two-col { grid-template-columns: 1fr 1fr; } }

  input, select, textarea {
    width: 100%;
    min-width: 0;
    min-height: 48px;
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  select {
    appearance: none;
    -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
    background-size: 6px 6px;
    background-repeat: no-repeat;
    padding-right: 36px;
  }
  input[type="datetime-local"] { -webkit-appearance: none; appearance: none; }
  textarea { resize: vertical; min-height: 90px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--err-text); }

  .choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .choice { position: relative; min-width: 0; }
  .choice input { position: absolute; opacity: 0; width: 1px; height: 1px; min-height: 0; }
  .choice span {
    display: block;
    text-align: center;
    padding: 12px 4px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    cursor: pointer;
    user-select: none;
  }
  .choice input:checked + span { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .choice input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 2px; }
  .field.invalid .choice span { border-color: var(--err-text); }

  .buttons { display: flex; gap: 8px; }
  button {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 8px;
    padding: 14px 20px;
    cursor: pointer;
    background: var(--primary);
    color: #fff;
  }
  button:hover { background: var(--primary-hover); }
  button.primary { flex: 1; }
  button.secondary { background: transparent; color: var(--primary); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--bg); }

  .message { margin: 12px 0 0; padding: 12px; border-radius: 8px; }
  .message.ok { background: var(--ok-bg); color: var(--ok-text); }
  .message.error { background: var(--err-bg); color: var(--err-text); }

  .summary { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
  .summary dt { color: var(--muted); }
  .summary dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .status { display: inline-block; padding: 1px 10px; border-radius: 999px; border: 1px solid #8a6100; color: #8a6100; font-size: 0.85rem; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .status { border-color: #e0b54a; color: #e0b54a; } }
</style>
</head>
<body>
  <header class="site-header">
    <h1>請假登記表</h1>
    <p>填寫下方表單送出請假，送出後由主管審核。</p>
  </header>

  <main>
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">新增請假</h2>
      <form id="leave-form" novalidate>
        <div class="field">
          <label for="applicant">請假人</label>
          <select id="applicant" name="applicant" required>
            <option value="">請選擇姓名</option>
          </select>
        </div>

        <fieldset class="field">
          <legend>假別</legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="leave_type" value="特休"><span>特休</span></label>
            <label class="choice"><input type="radio" name="leave_type" value="事假"><span>事假</span></label>
            <label class="choice"><input type="radio" name="leave_type" value="病假"><span>病假</span></label>
            <label class="choice"><input type="radio" name="leave_type" value="補休"><span>補休</span></label>
            <label class="choice"><input type="radio" name="leave_type" value="公假"><span>公假</span></label>
            <label class="choice"><input type="radio" name="leave_type" value="婚假"><span>婚假</span></label>
            <label class="choice"><input type="radio" name="leave_type" value="喪假"><span>喪假</span></label>
            <label class="choice"><input type="radio" name="leave_type" value="其他"><span>其他</span></label>
          </div>
        </fieldset>

        <div class="two-col">
          <div class="field">
            <label for="start_at">開始日期與時間</label>
            <input id="start_at" name="start_at" type="datetime-local">
          </div>
          <div class="field">
            <label for="end_at">結束日期與時間</label>
            <input id="end_at" name="end_at" type="datetime-local">
          </div>
        </div>

        <div class="two-col">
          <div class="field">
            <label for="hours">請假時數</label>
            <input id="hours" name="hours" type="number" inputmode="decimal" min="0.5" max="240" step="0.5" placeholder="例如：8">
            <small class="hint">以 0.5 小時為單位，最多 240 小時</small>
          </div>
          <div class="field">
            <label for="deputy">職務代理人 <span class="optional">（選填）</span></label>
            <select id="deputy" name="deputy">
              <option value="">不指定</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="reason">事由</label>
          <textarea id="reason" name="reason" rows="3" maxlength="200" placeholder="請簡短填寫，例如：家中私事"></textarea>
          <small class="hint"><span id="reason-count">0</span> / 200 字</small>
        </div>

        <div class="buttons">
          <button type="submit" class="primary">送出請假</button>
          <button type="reset" class="secondary">清除</button>
        </div>
        <p id="form-message" class="message" role="status" aria-live="polite" hidden></p>
      </form>
    </section>

    <section id="result" class="card" aria-labelledby="result-title" hidden>
      <h2 id="result-title">剛剛填寫的內容</h2>
      <dl id="summary" class="summary"></dl>
    </section>
  </main>

  <footer class="site-footer">表單樣式示範，姓名皆為虛構；送出內容不會儲存。</footer>

<script>
(function () {
  "use strict";

  // 10 位虛構同仁
  var NAMES = ["陳虛構", "林範例", "王假名", "張測試", "黃示範", "李演示", "吳模擬", "周樣本", "鄭編造", "劉虛擬"];

  var form = document.getElementById("leave-form");
  var applicant = document.getElementById("applicant");
  var deputy = document.getElementById("deputy");
  var reason = document.getElementById("reason");
  var reasonCount = document.getElementById("reason-count");
  var message = document.getElementById("form-message");
  var result = document.getElementById("result");
  var summary = document.getElementById("summary");

  NAMES.forEach(function (name) {
    applicant.add(new Option(name, name));
    deputy.add(new Option(name, name));
  });

  // 代理人不能選自己：請假人改變時，把同名的代理人選項停用
  function syncDeputy() {
    Array.prototype.forEach.call(deputy.options, function (opt) {
      opt.disabled = opt.value !== "" && opt.value === applicant.value;
    });
    if (deputy.value && deputy.value === applicant.value) deputy.value = "";
  }

  function setInvalid(el, bad) {
    el.closest(".field").classList.toggle("invalid", bad);
  }

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
    message.hidden = false;
  }

  function formatLocal(value) {
    var d = new Date(value);
    if (isNaN(d.getTime())) return "";
    return new Intl.DateTimeFormat("zh-TW", {
      year: "numeric", month: "2-digit", day: "2-digit", weekday: "short",
      hour: "2-digit", minute: "2-digit", hour12: false,
    }).format(d);
  }

  function checkedType() {
    var el = form.querySelector('input[name="leave_type"]:checked');
    return el ? el.value : "";
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var errors = [];
    function check(el, bad, text) { setInvalid(el, bad); if (bad) errors.push(text); }

    var type = checkedType();
    var start = form.start_at.value, end = form.end_at.value;
    var hoursText = form.hours.value.trim(), hours = Number(hoursText);
    var why = reason.value.trim();

    check(applicant, !applicant.value, "請選擇「請假人」");
    check(form.querySelector('input[name="leave_type"]'), !type, "請選擇「假別」");
    check(form.start_at, !start, "請填寫「開始日期與時間」");
    check(form.end_at, !end, "請填寫「結束日期與時間」");
    if (start && end && new Date(end) <= new Date(start)) check(form.end_at, true, "結束時間必須晚於開始時間");
    var hoursOk = hoursText !== "" && hours > 0 && hours <= 240 && hours * 2 === Math.floor(hours * 2);
    check(form.hours, !hoursOk, "「請假時數」需介於 0.5 到 240，且以 0.5 小時為單位");
    check(reason, !why, "請填寫「事由」");

    if (errors.length) {
      showMessage(errors.join("；") + "。", "error");
      result.hidden = true;
      return;
    }

    var rows = [
      ["請假人", applicant.value],
      ["假別", type],
      ["開始", formatLocal(start)],
      ["結束", formatLocal(end)],
      ["時數", hours + " 小時"],
      ["職務代理人", deputy.value || "不指定"],
      ["事由", why],
      ["審核狀態", null],
    ];
    summary.replaceChildren();
    rows.forEach(function (r) {
      var dt = document.createElement("dt");
      var dd = document.createElement("dd");
      dt.textContent = r[0];
      if (r[1] === null) {
        var tag = document.createElement("span");
        tag.className = "status";
        tag.textContent = "待審核";
        dd.appendChild(tag);
      } else {
        dd.textContent = r[1];
      }
      summary.appendChild(dt);
      summary.appendChild(dd);
    });
    result.hidden = false;
    showMessage("已送出請假（示範，不會儲存）。", "ok");
    result.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  form.addEventListener("reset", function () {
    message.hidden = true;
    result.hidden = true;
    form.querySelectorAll(".field.invalid").forEach(function (f) { f.classList.remove("invalid"); });
    setTimeout(function () { syncDeputy(); reasonCount.textContent = "0"; });
  });

  form.addEventListener("input", function (e) {
    var f = e.target.closest(".field");
    if (f) f.classList.remove("invalid");
  });
  form.addEventListener("change", function (e) {
    var f = e.target.closest(".field");
    if (f) f.classList.remove("invalid");
  });
  applicant.addEventListener("change", syncDeputy);
  reason.addEventListener("input", function () { reasonCount.textContent = String(reason.value.length); });
})();
</script>
</body>
</html>
